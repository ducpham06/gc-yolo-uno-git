; Yolo UNO (OhStem) = ESP32-S3. The generic ESP32-S3 board definition is used so the
; project builds with a stock PlatformIO install.
[platformio]
default_envs = yolo_uno_f32

[env]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.f_cpu = 240000000L
; 4 MB layout works on any ESP32-S3 module with >= 4 MB flash
board_upload.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
build_unflags = -Os
build_flags =
    -O2
    ; Yolo UNO talks over the ESP32-S3 native USB. If the serial monitor stays
    ; silent, set this to 0 (boards that route serial through a USB-UART chip).
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Single precision: uses the ESP32-S3 hardware FPU.
[env:yolo_uno_f32]
build_flags = ${env.build_flags} -DGC_REAL=float

; Double precision: software-emulated on ESP32-S3 (expect it to be much slower).
[env:yolo_uno_f64]
build_flags = ${env.build_flags} -DGC_REAL=double
